name: Update URDF

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      add_mjcf:
        description: 'Produce a MJCF description'
        default: false
        required: false
        type: boolean
  # Sent by the Onshape webhook relay (rice-robotics-club/onshape_webhook) when a new version of the document is created
  repository_dispatch:
    types: [onshape-version]

permissions:
  contents: write

# Never run two exports at once (e.g. two Onshape versions created in quick succession)
concurrency:
  group: update-urdf
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      ONSHAPE_API: ${{ vars.ONSHAPE_API }}
      ONSHAPE_ACCESS_KEY: ${{ secrets.ONSHAPE_ACCESS_KEY }}
      ONSHAPE_SECRET_KEY: ${{ secrets.ONSHAPE_SECRET_KEY }}

    steps:
      # Check out the branch head (not the triggering commit) so a queued run sees earlier runs' pushes
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install onshape-to-robot==1.8.3 xacro
      - run: sudo apt-get update && sudo apt-get install -y liburdfdom-tools

      - name: Pin the Onshape version from the webhook
        id: version
        if: github.event_name == 'repository_dispatch'
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: python scripts/pin_onshape_version.py

      # Fetch the assembly from Onshape once; robot.pkl lets the MJCF export below reuse it.
      - name: Export URDF and meshes
        run: onshape-to-robot --save-pickle .
      - run: mv -f robot.urdf urdf/robot.urdf

      - name: Generate xacro macro and top-level description
        run: python scripts/urdf_to_xacro.py urdf/robot.urdf

      - name: Export MJCF (from the already-downloaded robot)
        run: |
          # config.json may contain comments, so edit it with commentjson (an onshape-to-robot dependency)
          python -c "import commentjson, json; c = commentjson.load(open('config.json')); c['output_format'] = 'mujoco'; json.dump(c, open('config.json', 'w'), indent=2)"
          onshape-to-robot --convert .
          mkdir -p mjcf
          # meshdir is relative to the model file, which now lives one level down
          sed 's|meshdir="meshes"|meshdir="../meshes"|' robot.xml > mjcf/robot.xml
          rm -f robot.xml
          rm -f scene.xml
          git checkout -- config.json
        if: ${{ inputs.add_mjcf }}
      - run: rm -f robot.pkl

      - name: Validate description
        run: |
          for prefix in "" "r1_"; do
            xacro urdf/robot.urdf.xacro tf_prefix:="$prefix" > /tmp/robot_$prefix.urdf
            check_urdf /tmp/robot_$prefix.urdf
          done

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add urdf meshes
          if [ "${{ inputs.add_mjcf }}" = "true" ]; then git add mjcf; fi
          if git diff --cached --quiet; then
            echo "Description is already up to date; nothing to commit."
          else
            git commit -m "${COMMIT_MESSAGE:-Automated update by GitHub Action}"
            git push origin HEAD:${{ github.ref }}
          fi
          # Tag the commit matching this Onshape version (also when the version changed nothing here)
          if [ -n "$TAG" ]; then
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
              echo "Tag $TAG already exists; not moving it."
            else
              git tag -a "$TAG" -m "$COMMIT_MESSAGE"
              git push origin "refs/tags/$TAG"
            fi
          fi
        env:
          COMMIT_MESSAGE: ${{ steps.version.outputs.commit_message }}
          TAG: ${{ steps.version.outputs.tag }}
